name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The app targets Windows (win32 APIs throughout), so check on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Frontend type check
        run: npx tsc --noEmit

      - name: i18n completeness
        run: node scripts/check-i18n.mjs

      - name: Palette contrast
        run: npm run test:palettes

      - name: Updater asset selection
        run: npm run test:updater

      - name: Release notes
        run: npm run test:releases

      - name: Window chrome
        run: npm run test:window

      - name: Run command line
        run: npm run test:run

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      # Warnings are errors here: the tree is clean today, and an allowance
      # would quietly rot. `--all-targets` covers test code too, which is where
      # the last few lints were hiding.
      - name: Rust lints
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
