[package]
name = "kestrel"
version = "1.2.10"
description = "Kestrel - instant file search and launcher"
authors = ["Tyler Zhang"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kestrel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
serde_json = "1"
parking_lot = "0.12"
once_cell = "1"
jwalk = "0.8"
notify = "6"
pinyin = "0.10"
arboard = { version = "3", features = ["image-data"] }
trash = "5"
dirs = "5"
chrono = "0.4"
rayon = "1"
lnk = "0.5"
# The thumbnail feature lists jpg/jpeg among the supported formats, so the
# JPEG decoder has to be compiled in — without it every photo silently lost
# its preview.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
rmp-serde = "1"
flate2 = "1"
anyhow = "1"
regex = "1"
unicode-segmentation = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# panic = "abort" removed: a panic in a worker thread must not kill the whole
# app; panics are logged to %LOCALAPPDATA%\Kestrel\panic.log instead.
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
