<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Kestrel 02-focus indigo dark">
 <defs>
  <linearGradient id="bg" x1="40" y1="40" x2="984" y2="984" gradientUnits="userSpaceOnUse">
   <stop offset="0" stop-color="#262B38"/>
   <stop offset="1" stop-color="#11141C"/>
  </linearGradient>
  <linearGradient id="fg" x1="280" y1="270" x2="760" y2="770" gradientUnits="userSpaceOnUse">
   <stop offset="0" stop-color="#93A7FF"/>
   <stop offset="1" stop-color="#B78BFA"/>
  </linearGradient>
  <linearGradient id="sheen" x1="40" y1="40" x2="760" y2="860" gradientUnits="userSpaceOnUse">
   <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.075"/>
